name: photobooth
description: "A Korean 4-Cut Photobooth Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.1
  image: ^4.5.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  share_plus: ^10.1.4
  gal: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
